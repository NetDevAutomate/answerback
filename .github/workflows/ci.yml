name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and scripted self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The default sync: the kernel and its own providers, with the tracked tree
        # asserted free of any internal provider. A provider plugin's repository gates the
        # composition it makes.
        os: [ubuntu-latest, macos-latest]
    env:
      # Explicit even on hosts with nats-server or launchctl on PATH.
      ANSWERBACK_TEST_OFFLINE: "1"
      ANSWERBACK_LIVE_LAUNCHD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Install Chromium and its platform dependencies
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Check
        env:
          UV_OFFLINE: "1"
        run: just check
      - name: Scripted self-test
        env:
          UV_OFFLINE: "1"
        run: just self-test | tee self-test.json
      - name: Retain scripted protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ matrix.os }}
          path: self-test.json
          if-no-files-found: ignore
