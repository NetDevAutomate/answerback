name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and scripted self-test (${{ matrix.os }}, ${{ matrix.composition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # PUBLIC is the default sync: the kernel and its own providers, with the shipped
        # tree asserted free of the internal provider. INTERNAL adds the plugin packages of
        # the `internal` dependency group and runs their tests beside the kernel's.
        composition: [public, internal]
        include:
          - composition: public
            sync_groups: ""
            gate: check
          - composition: internal
            sync_groups: "--group internal"
            gate: check-internal
    env:
      # Explicit even on hosts with nats-server or launchctl on PATH.
      ANSWERBACK_TEST_OFFLINE: "1"
      ANSWERBACK_LIVE_LAUNCHD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - name: Install locked dependencies
        run: uv sync --locked --all-extras ${{ matrix.sync_groups }}
      - name: Install Chromium and its platform dependencies
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Check
        env:
          UV_OFFLINE: "1"
        run: just ${{ matrix.gate }}
      - name: Scripted self-test
        env:
          UV_OFFLINE: "1"
        run: just self-test | tee self-test.json
      - name: Retain scripted protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ matrix.os }}-${{ matrix.composition }}
          path: self-test.json
          if-no-files-found: ignore
